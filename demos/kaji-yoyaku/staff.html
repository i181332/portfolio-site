<script>
  /* 「大きく」を選んだ方に、標準→大きくの瞬きを見せないため、モジュールより先に読む */
  try {
    var p = JSON.parse(localStorage.getItem("kajiDemo.prefs"));
    if (p && p.fontScale === "large") document.documentElement.dataset.fontScale = "large";
  } catch (e) {}
</script>
<link rel="expect" href="#s3" blocking="render">
<script>
  /* 画面遷移（トップのスタッフ写真 ⇄ この頁の同じ人の写真）。pagereveal を取り逃さないよう、モジュールより先に読む */
  (function () {
    var KEY = "kajiDemo.person";
    var mark = function (id, vt) {
      var img = id && document.querySelector('[data-staff-card="' + id + '"] img');
      if (!img || !vt) return;
      img.style.viewTransitionName = "photo-" + id;
      vt.finished.finally(function () { img.style.viewTransitionName = ""; });
    };
    window.addEventListener("pagereveal", function (e) {
      var m = /^#(s\d)$/.exec(location.hash);
      if (e.viewTransition && m) mark(m[1], e.viewTransition);
    });
    window.addEventListener("pageswap", function (e) {
      if (!e.viewTransition || !e.activation) return;
      var to = e.activation.entry && e.activation.entry.url;
      var path = to ? new URL(to, location.href).pathname : "";
      if (!/(\/|index\.html)$/.test(path)) return;   // 行き先がトップの時だけ
      var id = null;
      try { id = sessionStorage.getItem(KEY); } catch (err) {}
      mark(id, e.viewTransition);
    });
  })();
</script>
