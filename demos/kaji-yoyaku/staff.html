<!doctype html>
<html lang="ja" data-font-scale="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>スタッフ紹介｜高尾の家事手伝い みどり（デモ）</title>
<meta name="description" content="八王子市の高尾周辺のご自宅へお伺いする家事代行のスタッフ3名の紹介です。得意なことと、お伺いできる曜日と時間を載せています。">
<script>
  /* 「大きく」を選んだ方に、標準→大きくの瞬きを見せないため、モジュールより先に読む */
  try {
    var p = JSON.parse(localStorage.getItem("kajiDemo.prefs"));
    if (p && p.fontScale === "large") document.documentElement.dataset.fontScale = "large";
  } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231E4A3A%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%228%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header data-chrome></header>

<main>
  <div class="page-head container">
    <h1>スタッフ紹介</h1>
    <p class="lead page-head__lead">お伺いするのは、この3人です。予約の時に担当を選べます。2回目からも、同じ担当を選んで予約できます。</p>
    <p class="note">写真は素材です（本番はご本人）。</p>
  </div>

  <section class="container" aria-label="スタッフ">
    <ul class="members" role="list" id="staff-list"></ul>
  </section>

  <section class="band band--mist page-closing" aria-labelledby="h-any">
    <div class="container page-closing__inner">
      <h2 class="page-closing__title" id="h-any">担当を決めずに予約する</h2>
      <p>空いている担当から選べます。どの担当も、同じ作業をお受けします。</p>
      <a class="btn btn--secondary page-closing__btn" data-book="any">空き状況を見て予約する</a>
      <span data-booking-note-slot></span>
    </div>
  </section>
</main>

<footer data-chrome></footer>

</body>
