<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%2323412F%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%228%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%223%22/%3E%3C/svg%3E">

<body>

<header data-chrome></header>

<main>
  <div class="page-head container">
    <h1>サービス内容</h1>
  </div>

  <section class="container s-sect" aria-label="お受けする家事">
    <ul class="s-tasks" role="list" id="service-list"></ul>
    <p class="note">写真は素材です。</p>
  </section>

  <section class="s-band s-band--mist" aria-labelledby="h-price">
    <div class="container s-sect">
      <h2 class="s-title" id="h-price">料金</h2>
      <p class="s-lead">1時間3,500円（2時間から）</p>
      <a class="link link--action" href="price.html">料金表を見る</a>
    </div>
  </section>

  <section class="container s-sect" aria-labelledby="h-ng">
    <h2 class="s-title" id="h-ng">お受けできない作業</h2>
    <ul class="s-list" role="list">
      <li>高い所の作業（脚立を使う窓ふき、照明の掃除など）</li>
      <li>大型の家具の移動、大量の不用品の処分</li>
      <li>庭の手入れ、害虫の駆除</li>
      <li>介護や医療にかかわること、ペットのお世話</li>
    </ul>
    <p class="note">ほかの作業は、予約の前に<a class="link" href="contact.html">お問い合わせ</a>ください。</p>
  </section>

  <section class="container s-sect" aria-labelledby="h-tool">
    <h2 class="s-title" id="h-tool">掃除の用具</h2>
    <p>ご自宅の物か、持参か<span class="s-tbd">本番で確認</span></p>
  </section>

  <section class="s-band s-band--close" aria-labelledby="h-close">
    <div class="container s-closing">
      <h2 class="s-title" id="h-close">ご予約</h2>
      <a class="btn btn--primary s-closing__btn" data-book="any">予約する</a>
      <span data-booking-note-slot></span>
    </div>
  </section>
</main>

<footer data-chrome></footer>

</body>
</html>
