<!doctype html>
<html lang="ja" data-font-scale="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>高尾の家事手伝い みどり（案C 色面）</title>
<script>
  try {
    var p = JSON.parse(localStorage.getItem("kajiDemo.prefs"));
    if (p && p.fontScale === "large") document.documentElement.dataset.fontScale = "large";
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<p class="demo-band">ご提案用のデモです。実際の請求はありません</p>

<header class="head">
  <a class="head__name" href="index.html">高尾の家事手伝い みどり</a>
  <nav class="head__nav" aria-label="メニュー">
    <ul>
      <li><a href="index.html" aria-current="page">トップ</a></li>
      <li><a href="staff.html">スタッフ</a></li>
      <li><a href="#price">料金</a></li>
      <li><a href="#flow">ご利用の流れ</a></li>
    </ul>
  </nav>
  <div class="scale" role="group" aria-label="文字の大きさ">
    <span class="scale__label" aria-hidden="true">文字</span>
    <button type="button" data-scale="normal" aria-pressed="true">標準</button>
    <button type="button" data-scale="large" aria-pressed="false">大きく</button>
  </div>
</header>

<main>
  <section class="plane plane--koke hero" aria-label="はじめに">
    <div class="hero__copy">
      <p class="hero__line">八王子市 高尾周辺<br>1時間 3,500円</p>
      <a class="book" href="https://book.squareup.com/appointments/yty8z30rub8b6y/location/L54G6PFCMRTWP">予約する</a>
    </div>
    <img class="hero__photo" src="../../assets/window-green.webp" alt="" width="1200" height="800">
    <h1 class="hero__name">
      <span class="hero__place">高尾の家事手伝い</span>
      <span class="hero__shop">みどり</span>
    </h1>
  </section>

  <section class="plane plane--wakaba" aria-labelledby="h-staff">
    <div class="plane__inner">
      <h2 id="h-staff">スタッフ</h2>
      <ul class="crew">
        <li class="crew__main"><a href="staff.html#s1">
          <img src="../../assets/staff-s1.webp" alt="" width="600" height="600">
          <span class="crew__name">山本 さち子</span>
        </a></li>
        <li><a href="staff.html#s2">
          <img src="../../assets/staff-s2.webp" alt="" width="600" height="600">
          <span class="crew__name">小林 和美</span>
        </a></li>
        <li><a href="staff.html#s3">
          <img src="../../assets/staff-s3.webp" alt="" width="600" height="600">
          <span class="crew__name">森田 恵</span>
        </a></li>
      </ul>
      <p class="note">写真は素材です（本番はご本人）</p>
    </div>
  </section>

  <section class="plane plane--white" id="price" aria-labelledby="h-price">
    <div class="plane__inner">
      <h2 id="h-price">料金</h2>
      <dl class="price">
        <div><dt>1時間</dt><dd>3,500<small>円</small></dd></div>
      </dl>
      <p class="price__note">ご利用は2時間からです</p>
    </div>
  </section>

  <section class="plane plane--wakaba" id="flow" aria-labelledby="h-flow">
    <div class="plane__inner">
      <h2 id="h-flow">ご利用の流れ</h2>
      <ol class="steps">
        <li>担当と日時を選んで予約</li>
        <li>担当がお伺い</li>
        <li>終わったらご報告</li>
      </ol>
    </div>
  </section>

  <section class="plane plane--koke close" aria-label="ご予約">
    <a class="book book--big" href="https://book.squareup.com/appointments/yty8z30rub8b6y/location/L54G6PFCMRTWP">予約する</a>
  </section>
</main>

<footer class="foot">
  <p>高尾の家事手伝い みどり</p>
  <p>東京都八王子市の高尾周辺</p>
</footer>

</body>
</html>
