<body>

<header data-chrome></header>

<main>
  <div class="page-head container">
    <h1>料金</h1>
  </div>

  <section class="container s-split" aria-label="料金">
    <div class="s-split__col">
    <p class="s-lead">1時間3,500円（2時間から）</p>
    <div class="table-wrap">
      <table class="table s-price">
        <thead><tr><th scope="col">利用時間</th><th scope="col">料金</th></tr></thead>
        <tbody>
          <tr><th scope="row">2時間</th><td>7,000円</td></tr>
          <tr><th scope="row">3時間</th><td>10,500円</td></tr>
          <tr><th scope="row">4時間</th><td>14,000円</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">どの作業も同じ料金です。担当を選んでも料金は変わりません。</p>
    </div>
    <div class="s-split__col">
      <h2 class="s-title" id="h-more">そのほかの料金</h2>
      <dl class="s-info">
        <div><dt>延長</dt><dd>1時間ごとに3,500円。当日の担当の予定が空いている時に限ります。延長分のお支払い方法は<span class="s-tbd">本番で確認</span></dd></div>
        <div><dt>交通費</dt><dd><span class="s-tbd">本番で確認</span></dd></div>
        <div><dt>取り消し料</dt><dd><span class="s-tbd">本番で確認</span></dd></div>
        <div><dt>税の扱い</dt><dd>税込<span class="s-tbd">本番で確認</span></dd></div>
        <div><dt>お支払いの方法</dt><dd>予約の時にカードで（Square 予約）。ほかの方法は<span class="s-tbd">本番で確認</span></dd></div>
      </dl>
      <a class="link link--action" href="payment.html" data-pay-link hidden>カード払いを試す（テスト）</a>
    </div>
  </section>

  <section class="s-band s-band--close" aria-labelledby="h-close">
    <div class="container s-closing">
      <h2 class="s-title" id="h-close">ご予約</h2>
      <a class="btn btn--primary s-closing__btn" data-book="any">予約する</a>
      <span data-booking-note-slot></span>
    </div>
  </section>
</main>

<footer data-chrome></footer>

</body>
</html>
